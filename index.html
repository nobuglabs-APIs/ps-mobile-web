    <script>
      (function() {
        try {
          var _rawFetch = window.fetch;
          var _activeFetch = _rawFetch ? _rawFetch.bind(window) : undefined;
          
          function getFetch() {
            return _activeFetch;
          }
          function setFetch(val) {
            _activeFetch = val;
          }

          try {
            Object.defineProperty(window, 'fetch', {
              get: getFetch,
              set: setFetch,
              configurable: true,
              enumerable: true
            });
          } catch (errWindow) {
            try {
              var proto = Object.getPrototypeOf(window) || Window.prototype;
              Object.defineProperty(proto, 'fetch', {
                get: getFetch,
                set: setFetch,
                configurable: true,
                enumerable: true
              });
            } catch (errProto) {}
          }

          window.addEventListener('error', function(e) {
            if (e && e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1) {
              if (e.preventDefault) e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          }, true);
        } catch (globalErr) {}
      })();
    </script>
